<svg viewBox="0 0 560 424" role="img" preserveAspectRatio="xMidYMid meet"
               aria-label="Two-process architecture: an MCP host sends JSON-RPC over stdio to Layer A, the bridge interpreter with FastMCP server, typed contract registry and a first PathGuard; a per-job subprocess boundary separates it from Layer B, the licensed ArcGIS Pro interpreter, where PathGuard re-validates before the ArcPy runtime and a structured NDJSON result frame.">
            <defs>
              <marker id="mA" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="var(--green)"/></marker>
            </defs>
            <text class="d-title" x="20" y="24">LOCAL-FIRST MCP / TWO PROCESSES</text>
            <text class="d-micro" x="540" y="24" text-anchor="end">SHEET B-02</text>
            <path class="d-rule" d="M20 34H540"/>

            <text class="d-micro" x="20" y="52">01 / MCP HOST</text>
            <g class="d-pop">
              <rect class="d-box" x="20" y="60" width="520" height="44"/>
              <text class="d-node" x="280" y="80" text-anchor="middle">CLAUDE DESKTOP · CURSOR · MCP HOSTS</text>
              <text class="d-sub"  x="280" y="95" text-anchor="middle">UNTRUSTED TOOL ARGUMENTS ENTER HERE</text>
            </g>
            <path class="d-flow" d="M280 104v20" marker-end="url(#mA)"/>
            <text class="d-micro" x="292" y="119">JSON-RPC 2.0 / STDIO</text>

            <text class="d-micro" x="20"  y="146">LAYER A / BRIDGE INTERPRETER</text>
            <text class="d-micro" x="540" y="146" text-anchor="end">server.py</text>
            <rect class="d-zone" x="20" y="154" width="520" height="88"/>
            <g class="d-pop" style="--dly:110ms">
              <rect class="d-box d-box--g" x="26"  y="168" width="160" height="42"/><text class="d-node" x="106" y="188" text-anchor="middle">FASTMCP SERVER</text><text class="d-sub" x="106" y="203" text-anchor="middle">ASYNC · NO ARCPY</text>
              <rect class="d-box"         x="200" y="168" width="160" height="42"/><text class="d-node" x="280" y="188" text-anchor="middle">CONTRACT REGISTRY</text><text class="d-sub" x="280" y="203" text-anchor="middle">PYDANTIC V2 · 100 TOOLS</text>
              <rect class="d-box d-box--a" x="374" y="168" width="160" height="42"/><text class="d-node" x="454" y="188" text-anchor="middle">PATHGUARD A</text><text class="d-sub" x="454" y="203" text-anchor="middle">PRE-CHECK · CONFIRM</text>
            </g>
            <text class="d-micro" x="280" y="230" text-anchor="middle">NOTHING LICENSED IS TOUCHED IN THIS PROCESS</text>

            <path class="d-flow" d="M280 242v40" marker-end="url(#mA)"/>
            <rect class="d-box" x="170" y="252" width="220" height="22"/>
            <text class="d-sub" x="280" y="267" text-anchor="middle">SUBPROCESS BOUNDARY · PER JOB</text>

            <text class="d-micro" x="20"  y="300">LAYER B / LICENSED ARCGIS PRO</text>
            <text class="d-micro" x="540" y="300" text-anchor="end">worker.py · WINDOWS ONLY</text>
            <rect class="d-zone d-zone--a" x="20" y="308" width="520" height="80"/>
            <g class="d-pop" style="--dly:220ms">
              <rect class="d-box d-box--a" x="26"  y="320" width="150" height="42"/><text class="d-node" x="101" y="340" text-anchor="middle">PATHGUARD B</text><text class="d-sub" x="101" y="355" text-anchor="middle">RE-VALIDATE</text>
              <rect class="d-box"         x="205" y="320" width="150" height="42"/><text class="d-node" x="280" y="340" text-anchor="middle">ARCPY RUNTIME</text><text class="d-sub" x="280" y="355" text-anchor="middle">.APRX · .GDB · RASTER</text>
              <rect class="d-box d-box--g" x="384" y="320" width="150" height="42"/><text class="d-node" x="459" y="340" text-anchor="middle">RESULT FRAME</text><text class="d-sub" x="459" y="355" text-anchor="middle">STRUCTURED NDJSON</text>
            </g>
            <path class="d-flow" d="M176 341h20" marker-end="url(#mA)"/>
            <path class="d-flow" d="M355 341h20" marker-end="url(#mA)"/>
            <text class="d-micro" x="280" y="378" text-anchor="middle">PYTHON 3.11+ · ARCGIS PRO 3.1–3.3 · 86-TEST OFFLINE GATE</text>

            <rect class="d-box d-box--d" x="20" y="398" width="520" height="26"/>
            <text class="d-node" x="280" y="415" text-anchor="middle">VALIDATION · SECURITY · LICENSE · GEOPROCESSING</text>
          </svg>