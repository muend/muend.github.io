<svg viewBox="0 0 1140 528" role="img" preserveAspectRatio="xMidYMid meet"
           aria-label="System atlas: an evaluation and knowledge layer and a data and model layer feed a core practice of reliable spatial systems, which is served by a guarded execution layer and delivered through a product layer.">
        <defs>
          <marker id="pA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--green)"/></marker>
          <marker id="pAa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="var(--amber-deep)"/></marker>
        </defs>
        <text class="d-title" x="20" y="26">SYSTEM ATLAS / KNOWLEDGE → EXECUTION → ARTIFACT</text>
        <text class="d-micro" x="1120" y="26" text-anchor="end">REV. 04 / 2026</text>
        <path class="d-rule" d="M20 36H1120"/>

        <!-- connectors -->
        <path class="d-flow--a" d="M340 128H400V236H428" marker-end="url(#pAa)"/>
        <path class="d-flow"    d="M800 128H740V236H712" marker-end="url(#pA)"/>
        <path class="d-flow"    d="M340 448H400V294H428" marker-end="url(#pA)"/>
        <path class="d-flow"    d="M800 448H740V294H712" marker-end="url(#pA)"/>
        <text class="d-micro" x="408" y="180">ROUTING / INVARIANTS</text>
        <text class="d-micro" x="732" y="180" text-anchor="end">GUARDED EXECUTION</text>
        <text class="d-micro" x="408" y="360">DATA / MODEL EVIDENCE</text>
        <text class="d-micro" x="732" y="360" text-anchor="end">PUBLIC DELIVERY</text>

        <!-- core -->
        <g class="d-pop" style="--dly:320ms">
          <rect class="d-box d-box--ink" x="428" y="206" width="284" height="118"/>
          <text class="d-micro d-inv" x="570" y="236" text-anchor="middle" opacity=".72">CORE PRACTICE</text>
          <text class="d-h d-inv" x="570" y="266" text-anchor="middle">Reliable spatial systems</text>
          <text class="d-sub d-inv" x="570" y="290" text-anchor="middle" opacity=".8">RESEARCH RIGOR · ENGINEERING · DELIVERY</text>
          <path d="M508 308h124" stroke="var(--amber)" stroke-width="2"/>
        </g>

        <!-- N-01 -->
        <g class="d-pop">
          <rect class="d-box" x="40" y="70" width="300" height="116"/>
          <text class="d-micro d-accent" x="58" y="96">N-01 / EVALUATION + KNOWLEDGE</text>
          <text class="d-h" x="58" y="124">benchfck + geoai-skills</text>
          <text class="d-note" x="58" y="148">Measures controlled reasoning and routes</text>
          <text class="d-note" x="58" y="164">spatial work with explicit invariants.</text>
        </g>
        <!-- N-02 -->
        <g class="d-pop" style="--dly:100ms">
          <rect class="d-box" x="800" y="70" width="300" height="116"/>
          <text class="d-micro d-accent" x="818" y="96">N-02 / EXECUTION LAYER</text>
          <text class="d-h" x="818" y="124">arcgis-mcp-bridge</text>
          <text class="d-note" x="818" y="148">Runs licensed ArcGIS operations behind</text>
          <text class="d-note" x="818" y="164">guarded process boundaries.</text>
        </g>
        <!-- N-03 -->
        <g class="d-pop" style="--dly:200ms">
          <rect class="d-box" x="40" y="390" width="300" height="116"/>
          <text class="d-micro d-accent" x="58" y="416">N-03 / DATA + MODEL LAYER</text>
          <text class="d-h" x="58" y="444">Sentinel pipeline + U-Net</text>
          <text class="d-note" x="58" y="468">Prepares reproducible EO datasets and</text>
          <text class="d-note" x="58" y="484">downstream segmentation work.</text>
        </g>
        <!-- N-04 -->
        <g class="d-pop" style="--dly:300ms">
          <rect class="d-box" x="800" y="390" width="300" height="116"/>
          <text class="d-micro d-accent" x="818" y="416">N-04 / PRODUCT LAYER</text>
          <text class="d-h" x="818" y="444">agri-dss · FOUNDER.EXE</text>
          <text class="d-note" x="818" y="468">Turns spatial and institutional knowledge</text>
          <text class="d-note" x="818" y="484">into usable interactive systems.</text>
        </g>
      </svg>